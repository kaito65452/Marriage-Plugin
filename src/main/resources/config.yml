# ===== Debug Mode =====
# Kalau true, plugin akan cetak log tambahan ke console server buat bantu troubleshooting.
# Bisa juga di-toggle langsung in-game pakai /marry debug <on|off>
debug: false

# ===== Pengaturan Pernikahan =====
marry:
  cooldown-seconds: 60
  proposal-timeout-seconds: 120

# ===== Pengaturan Kiss =====
kiss:
  enabled: true
  cooldown-seconds: 30
  max-distance: 2.0
  particle: HEART
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

# ===== Pengaturan Gift =====
gift:
  money:
    enabled: true
    min-amount: 1.0
    max-amount: 1000000.0
  item:
    enabled: true
    blacklist:
      - BEDROCK
      - BARRIER
      - STRUCTURE_BLOCK
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK

# ===== Pengaturan Teleport =====
tp:
  enabled: true
  cooldown-seconds: 600
  allow-cross-world: true

# ===== Pengaturan Home =====
home:
  enabled: true
  max-homes: 3

# ===== Database =====
database:
  file-name: "marriage.db"

# ===== Pesan =====
